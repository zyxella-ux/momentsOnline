<!DOCTYPE html>
<html>
  <head>
    <title>Time-based Interaction</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <!-- css -->
    <link rel="stylesheet" href="style2.css">
  </head>

  <body>
    <img id="bg">
    <div class="container">  
      <div id="mainText1"></div>
      <div id="mainText2"></div>
      <div class="wave-container">
          <a href="index.html">
            <img id="image1">
          </a>
      </div>
    </div>
    <svg width="0" height="0">
      <filter id="wave">
        <feTurbulence
        type="turbulence"
        baseFrequency="0.001 0.005"
        numOctaves="2"
        result="t">
        <animate
        attributeName="baseFrequency"
        dur="6s"
        values="0.01 0.02;0.02 0.03;0.01 0.02"
        repeatCount="indefinite"/>  
        </feTurbulence>

        <feDisplacementMap
        in="SourceGraphic"
        in2="t"
        scale="8"
        xChannelSelector="R"
        yChannelSelector="G"
        />
      </filter>
    </svg>
    <audio src="./audio/soundeffect.mp3" autoplay></audio>
    <script type="text/javascript" src="script2.js"></script>

  </body>
</html>
